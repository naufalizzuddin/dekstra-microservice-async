worker_processes auto;
worker_rlimit_nofile 65535;

events {
    worker_connections 4096;
    multi_accept on;
}

http {
    resolver 127.0.0.11 valid=10s ipv6=off;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 30;
    keepalive_requests 1000;
    client_body_timeout 60s;
    client_header_timeout 60s;
    client_max_body_size 25m;
    send_timeout 120s;

    server {
        listen 80;

        set $user_api http://user-api:8001;
        set $reporting_api http://reporting-api:8003;
        set $document_api http://document-api:8004;
        set $approval_api http://approval-api:8005;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;

        location = / {
            add_header Content-Type text/plain;
            return 200 "Dekstra microservice gateway\n";
        }

        location /static/ {
            proxy_pass $user_api;
        }

        location /registrasi-media/ {
            proxy_pass $user_api;
        }

        location /auth-admin/ {
            proxy_pass $user_api;
        }

        location /registrasi-admin/ {
            proxy_pass $user_api;
        }

        location /user-admin/ {
            proxy_pass $user_api;
        }

        location /citizen-admin/ {
            rewrite ^/citizen-admin/(.*)$ /registrasi-admin/$1 redirect;
        }

        location /dashboard-admin/ {
            proxy_pass $reporting_api;
        }

        location /reporting-admin/ {
            rewrite ^/reporting-admin/(.*)$ /dashboard-admin/$1 redirect;
        }

        location /surat-admin/ {
            proxy_pass $document_api;
        }

        location /document-admin/ {
            rewrite ^/document-admin/(.*)$ /surat-admin/$1 redirect;
        }

        location /auth/login/ {
            proxy_pass $user_api;
        }

        location /auth/otp/request/login/ {
            proxy_pass $user_api;
        }

        location /auth/refresh/ {
            proxy_pass $user_api;
        }

        location /auth/otp/verify/reset-password/ {
            proxy_pass $user_api;
        }

        location /auth/otp/request/reset-password/ {
            proxy_pass $user_api;
        }

        location /internal/auth/ {
            proxy_pass $user_api;
        }

        location /auth/register/ {
            proxy_pass $user_api;
        }

        location /wilayah/ {
            proxy_pass $user_api;
        }

        location /pendaftaran-akun/ {
            proxy_pass $user_api;
        }

        location /verifikasi/pendaftaran-akun/ {
            proxy_pass $user_api;
        }

        location /media/pendaftaran/ {
            proxy_pass $user_api;
        }

        location /media/ {
            proxy_pass $document_api;
        }

        location /profil/ {
            proxy_pass $reporting_api;
        }

        location /dashboard/ {
            proxy_pass $reporting_api;
        }

        location /notifikasi/ {
            proxy_pass $reporting_api;
        }

        location /jenis-surat/ {
            proxy_pass $document_api;
        }

        location /pengajuan-surat/ {
            proxy_pass $document_api;
        }

        location /upload/berkas-surat/ {
            proxy_pass $document_api;
        }

        location /media/permohonan/ {
            proxy_pass $document_api;
        }

        location /riwayat-pengajuan/ {
            proxy_pass $document_api;
        }

        location /riwayat-persetujuan/ {
            proxy_pass $approval_api;
        }

        location /berkas/ {
            proxy_pass $document_api;
        }
    }
}
